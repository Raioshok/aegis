[workspace]
resolver = "2"
# The Tauri desktop app (app/src-tauri) is its own package with a Tauri-specific
# build profile, so it is excluded from the library workspace.
exclude = ["app"]
members = [
    "crates/aegis-core",
    "crates/aegis-platform",
    "crates/aegis-engine",
    "crates/aegis-storage",
    "crates/aegis-quarantine",
    "crates/aegis-behavior",
    "crates/aegis-firewall",
    "crates/aegis-network",
    "crates/aegis-plugin",
    "crates/aegis-optimize",
    "crates/aegis-ebpf",
    "crates/aegis-ipc",
    "crates/aegis-daemon",
    "crates/aegis-cli",
    "crates/aegis-android",
]
default-members = [
    "crates/aegis-core",
    "crates/aegis-platform",
    "crates/aegis-engine",
    "crates/aegis-storage",
    "crates/aegis-quarantine",
    "crates/aegis-behavior",
    "crates/aegis-firewall",
    "crates/aegis-network",
    "crates/aegis-plugin",
    "crates/aegis-optimize",
    "crates/aegis-ipc",
    "crates/aegis-daemon",
    "crates/aegis-cli",
    "crates/aegis-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["Aegis Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/raio/aegis"
description = "Aegis — a next-generation, native antivirus platform for Linux"

# Shared dependency versions — pinned to mature, widely-audited crate lines for
# reproducible builds. Newer major lines (sha2 0.11, aes-gcm 0.11) are avoided
# deliberately in M1 to keep the transitive API surface stable.
[workspace.dependencies]
# error handling & logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# concurrency & fs
rayon = "1"
walkdir = "2"
memmap2 = "0.9"
# hashing
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
# detection
yara-x = "1"
regex = "1"
infer = "0.15"
goblin = "0.9"
# crypto (quarantine at rest)
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
# storage
rusqlite = { version = "0.31", features = ["bundled"] }
# cli & time
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "macros"] }
# async runtime & real-time (daemon)
tokio = { version = "1", features = ["full"] }
inotify = "0.11"
nix = { version = "0.31", features = ["fanotify", "fs"] }
sd-notify = "0.5"
# internal crates
aegis-core = { path = "crates/aegis-core" }
aegis-platform = { path = "crates/aegis-platform" }
aegis-engine = { path = "crates/aegis-engine" }
aegis-storage = { path = "crates/aegis-storage" }
aegis-quarantine = { path = "crates/aegis-quarantine" }
aegis-behavior = { path = "crates/aegis-behavior" }
aegis-firewall = { path = "crates/aegis-firewall" }
aegis-network = { path = "crates/aegis-network" }
aegis-plugin = { path = "crates/aegis-plugin" }
aegis-optimize = { path = "crates/aegis-optimize" }
aegis-ipc = { path = "crates/aegis-ipc" }
aegis-daemon = { path = "crates/aegis-daemon" }
aegis-android = { path = "crates/aegis-android" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.bench]
lto = "thin"
