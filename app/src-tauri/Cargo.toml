[package]
name = "aegis-ui"
version = "0.1.0"
edition = "2021"
description = "Aegis desktop UI (Tauri v2)"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Aegis engine crates (path deps into the sibling workspace).
aegis-core = { path = "../../crates/aegis-core" }
aegis-engine = { path = "../../crates/aegis-engine" }
aegis-storage = { path = "../../crates/aegis-storage" }
aegis-quarantine = { path = "../../crates/aegis-quarantine" }
aegis-behavior = { path = "../../crates/aegis-behavior" }
aegis-ipc = { path = "../../crates/aegis-ipc" }

[features]
# Enables Tauri's custom-protocol asset loading in production builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
