[package]
name = "aegis-android"
version = "0.1.0"
edition = "2021"
description = "Aegis Android Antivirus Engine: APK manifest analysis, DEX bytecode heuristics, and JNI bindings"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aegis-core = { path = "../aegis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"
