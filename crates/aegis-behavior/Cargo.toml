[package]
name = "aegis-behavior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aegis behavioral engine: ransomware guard, rootkit & memory scanners, sandbox"

[dependencies]
aegis-core.workspace = true
aegis-engine.workspace = true
aegis-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["signal", "resource", "process"] }
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
] }

[features]
rollback = []

[dev-dependencies]
tempfile = "3"
