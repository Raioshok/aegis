[package]
name = "aegis-behavior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aegis behavioral engine: ransomware guard, rootkit & memory scanners, sandbox"

[dependencies]
aegis-core.workspace = true
aegis-engine.workspace = true
serde.workspace = true
tracing.workspace = true
nix = { workspace = true, features = ["signal", "resource", "process"] }
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"

[features]
# Write-interception ransomware rollback via fanotify permission events.
# Requires CAP_SYS_ADMIN at runtime.
rollback = ["nix/fanotify"]

[dev-dependencies]
tempfile = "3"

[[example]]
name = "rollback_guard"
required-features = ["rollback"]
