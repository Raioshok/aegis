[package]
name = "aegis-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aegis OS-abstraction platform layer (Linux and Windows implementations)"

[dependencies]
aegis-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
zeroize.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time"] }
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["signal", "process", "fs", "fanotify"] }
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_Security_WinTrust",
    "Wdk_System_Threading",
] }
windows-service = "0.8"
