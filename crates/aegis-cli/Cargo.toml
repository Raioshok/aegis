[package]
name = "aegis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aegis command-line interface"

[[bin]]
name = "aegis"
path = "src/main.rs"

[features]
# Enable the privileged fanotify real-time backend in the bundled daemon.
fanotify = ["aegis-daemon/fanotify"]

[dependencies]
aegis-core.workspace = true
aegis-engine.workspace = true
aegis-storage.workspace = true
aegis-quarantine.workspace = true
aegis-behavior.workspace = true
aegis-firewall.workspace = true
aegis-network.workspace = true
aegis-plugin.workspace = true
aegis-ipc.workspace = true
aegis-daemon.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
tokio = { workspace = true }
ipnetwork = "0.21"
